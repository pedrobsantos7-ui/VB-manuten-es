<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - VB manutenções</title>
</head>
<body>
    <header>
        <h1>VB manutenções</h1>
        <nav>
            <a href="index.html">Index</a>
            <a href="servico.html">Serviço</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>    
    </header>

    <main>
        <h2>Faça seu agendamento</h2>
        <p>Abaixo coloque suas informções e o seu serviço e após isso entraremos em contato para fazer o trabalho.</p>
         <a href="https://share.google/a3F40AX5C7iF5a1TD">Localização da nossa oficina</a>

          <h2>Agende seu seviço</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required>
            <br>
            <label for="telefone">Telefone:</label>
            <input type="tel" 
            name="telefone" 
            id="telefone"
             required
             inputmode="numeric"
             maxlength="15"
             pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
             title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321"
            >
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora" required>
            <br>
             <label for="servico">Serviço</label>
            <select name="servico" id="servico" >
                <option value="">Selecione uma opção</option>
                <option value="">Manutenção Preventiva e Troca de Óleo/Filtros</option>
                <option value="">Revisão e Manutenção do Sistema de Freios</option>
                <option value="">Manutenção e Reparo do Sistema Hidráulico</option>
                <option value="">Revisão Completa da Transmissão e Embreagem</option>
                <option value="">Alinhamento, Solda Estrutural e Troca de Peças de Desgaste</option>
                </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>
        </form>

           
    </main>



    <footer>VB Manutenções - Todos os direitos reservados.</footer>
</body>
</html>
